name: Relatório Semanal de Monitoramento

on:
  schedule:
    - cron: '0 13 * * 1' # segunda-feira 10h Brasil (UTC-3) — roda após os dois projetos
  workflow_dispatch:

jobs:
  relatorio:
    runs-on: ubuntu-latest

    env:
      EMAIL_SERVER:            ${{ secrets.EMAIL_SERVER }}
      EMAIL_PORT:              ${{ secrets.EMAIL_PORT }}
      EMAIL_USERNAME:          ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD:          ${{ secrets.EMAIL_PASSWORD }}
      RELATORIO_PARA:          ${{ secrets.RELATORIO_PARA }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      LOG_SHEET_ID:            ${{ secrets.LOG_SHEET_ID }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests

      - name: Enviar relatório semanal
        run: python relatorio_semanal.py
