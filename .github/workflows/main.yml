name: Envio semanal de emails - Push Campo

on:
  schedule:
    - cron: '0 11 * * 1' # segunda-feira 08h Brasil (UTC-3)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    env:
      POLOTRIAL_URL: ${{ secrets.POLOTRIAL_URL }}
      POLOTRIAL_USER: ${{ secrets.POLOTRIAL_USER }}
      POLOTRIAL_PASSWORD: ${{ secrets.POLOTRIAL_PASSWORD }}
      EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      ENVIO_PARA: ${{ secrets.ENVIO_PARA }}
      ENVIAR_PARA: ${{ secrets.ENVIAR_PARA }}
      DESTINATARIO_HMCG: ${{ secrets.DESTINATARIO_HMCG }}
      DESTINATARIO_ROCIO: ${{ secrets.DESTINATARIO_ROCIO }}
      DESTINATARIO_SCS: ${{ secrets.DESTINATARIO_SCS }}
      DESTINATARIO_IIR: ${{ secrets.DESTINATARIO_IIR }}
      DESTINATARIO_VIVIANE: ${{ secrets.DESTINATARIO_VIVIANE }}
      DESTINATARIO_CAPIBARIBE: ${{ secrets.DESTINATARIO_CAPIBARIBE }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      LOG_SHEET_ID: ${{ secrets.LOG_SHEET_ID }}
      
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar notebook
        run: |
          python -m nbconvert \
            --to notebook \
            --execute push_atualizacoes.ipynb \
            --output push_atualizacoes_executado.ipynb \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=600
        working-directory: ${{ github.workspace }}
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          LOG_SHEET_ID: ${{ secrets.LOG_SHEET_ID }}

      - name: Mostrar outputs do notebook
        if: always()
        run: |
          python -c "
          import json
          with open('push_atualizacoes_executado.ipynb') as f:
              nb = json.load(f)
          for i, cell in enumerate(nb['cells']):
              if cell.get('cell_type') != 'code': continue
              outputs = cell.get('outputs', [])
              if outputs:
                  print(f'--- Célula {i} ---')
                  for o in outputs:
                      if 'text' in o: print(''.join(o['text']))
                      if 'traceback' in o: print(''.join(o['traceback']))
          "
        working-directory: ${{ github.workspace }}
